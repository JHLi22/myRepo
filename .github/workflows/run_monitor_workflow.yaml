name: Real-Time Wealth Monitor

on:
  schedule:
    # Runs every 2 hours from 8:00 AM to 4:00 PM UTC (adjust for your timezone)
    # Monday to Friday, excluding federal holidays
    - cron: '0 13,15,17,19,21 * * 1-5'
  
  # Allows you to run this workflow manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  build-and-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # Caches dependencies to speed up runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Wealth Monitor Script
        env:
          # MAP YOUR SECRETS HERE
          # Go to Settings > Secrets and variables > Actions > New repository secret
          TG_TOKEN: ${{ secrets.TG_TOKEN }} 
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python src/real_time_monitor.py
